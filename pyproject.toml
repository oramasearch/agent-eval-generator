[project]
name = "agent-eval-generator"
version = "0.2.0"
description = "Eval Generator Agent: generates eval profiles (a situation plus its data) to score Orama's agents, as a Lake library agent and a batch CLI"
readme = "README.md"
authors = [
    { name = "Orama Search Inc." }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-eval-generator = "agent_eval_generator:main"
agent-eval-generator-serve = "agent_eval_generator.service:serve"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
